<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jezreel AI - Ghana</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#070a12;color:#e6e8f0;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
#header{background:#0f1320;border-bottom:1px solid #1e2642;padding:12px 16px}
.logo{font-weight:800;font-size:18px}.logo span{color:#5b8def}
#subRow{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.sub{white-space:nowrap;padding:6px 12px;background:#161c2e;border:1px solid #222d4d;border-radius:100px;font-size:12px;cursor:pointer}
.sub.active{background:#5b8def;border-color:#5b8def;color:white}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.6;font-size:14.5px;white-space:pre-wrap;animation:pop.2s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.user{align-self:flex-end;background:linear-gradient(135deg,#5b8def,#7a5bff);color:white}
.ai{align-self:flex-start;background:#12182b;border:1px solid #1e2a4a}
.time{font-size:10px;color:#6b7a9e;margin-top:6px}
.example{display:inline-block;margin:4px;padding:8px 10px;background:#11172a;border:1px dashed #2a375f;border-radius:10px;font-size:12px;cursor:pointer}
#bar{display:flex;gap:8px;padding:10px 12px;background:#0f1320;border-top:1px solid #1e2642}
#input{flex:1;padding:12px;border-radius:12px;border:1px solid #222d4d;background:#161c2e;color:white;resize:none;outline:none}
#send{width:44px;height:44px;border-radius:12px;border:none;background:#5b8def;color:white;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="header">
<div class="logo">📚 Jezreel <span>AI</span> 🇬🇭</div>
<div style="font-size:11px;color:#6b7a9e">BECE • WASSCE • No ID needed • Built in Ghana</div>
<div id="subRow">
<div class="sub active" data-sub="General">🌍 General</div>
<div class="sub" data-sub="Maths">📐 Maths</div>
<div class="sub" data-sub="Science">🔬 Science</div>
<div class="sub" data-sub="English">📝 English</div>
<div class="sub" data-sub="Life Help">💡 Life</div>
</div>
</div>
<div id="chat">
<div class="msg ai">Hi I'm <b>Jezreel AI</b>! No ID needed now 🎉<br><br>Ask me:<br>
<span class="example" onclick="askEx(this)">Solve 2x+5=15 for BECE</span>
<span class="example" onclick="askEx(this)">Explain photosynthesis</span>
</div>
</div>
<div id="bar">
<textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
<button id="send">↑</button>
</div>
<script>
const API_KEY = "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...";
let activeSubject="General";
const chat=document.getElementById('chat'); const input=document.getElementById('input');
document.querySelectorAll('.sub').forEach(s=>{s.onclick=()=>{document.querySelectorAll('.sub').forEach(x=>x.classList.remove('active'));s.classList.add('active');activeSubject=s.dataset.sub;}});
function askEx(el){input.value=el.innerText;sendMessage();}
async function sendMessage(){
 const text=input.value.trim(); if(!text) return;
 chat.innerHTML+=`<div class="msg user">${text}</div>`; input.value="";
 const aiDiv=document.createElement('div'); aiDiv.className="msg ai"; aiDiv.textContent=`Thinking in ${activeSubject}...`; chat.appendChild(aiDiv); chat.scrollTop=chat.scrollHeight;
 try{
  const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${API_KEY}`},
   body:JSON.stringify({model:"llama-3.3-70b-versatile", messages:[{role:"system",content:`You are Jezreel AI from Ghana. Teach BECE/WASSCE step-by-step simple English. Subject: ${activeSubject}. Keep short max 200 words.`},{role:"user",content:text}], temperature:0.7})
  });
  const data=await res.json();
  if(data.error){aiDiv.textContent="❌ "+data.error.message+" - Did you paste Groq key correctly? (starts with gsk_)"; return;}
  aiDiv.innerHTML=data.choices[0].message.content.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')+`<div class="time">${activeSubject}</div>`;
 }catch(e){aiDiv.textContent="Error: "+e.message;}
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('send').onclick=sendMessage;
input.addEventListener('keydown',e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
</script>
</body>
</html>
