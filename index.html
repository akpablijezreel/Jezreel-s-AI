<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jezreel AI - by Akpabli Jezreel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#1a2a5e 0,#0a0a12 60%);color:#fff;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff12}
.logo{font-weight:800;font-size:22px;cursor:pointer;user-select:none}
.logo span{color:#8ea8ff}
nav{display:flex;gap:14px;font-size:13px}
nav a{cursor:pointer;color:#a1a1bb;text-decoration:none}
#chat{flex:1;overflow-y:auto;padding:20px;max-width:900px;width:100%;margin:0 auto}
.welcome{text-align:center;margin-top:60px}
.welcome h1{font-size:38px;background:linear-gradient(90deg,#8ea8ff,#c2a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.msg{margin:16px 0;padding:14px 18px;border-radius:18px;line-height:1.6;max-width:85%;white-space:pre-wrap}
.user{background:linear-gradient(135deg,#4a72ff,#6d8cff);margin-left:auto;border-bottom-right-radius:6px}
.ai{background:#161f3a;border:1px solid #ffffff14;border-bottom-left-radius:6px}
#bar{display:flex;gap:10px;padding:16px;background:#0d1224cc;backdrop-filter:blur(20px);border-top:1px solid #ffffff12;max-width:900px;width:100%;margin:0 auto}
#input{flex:1;background:#1a2547;border:1px solid #ffffff15;padding:14px 18px;border-radius:24px;color:white;outline:none;font-size:16px}
#bar button{background:#4a72ff;color:white;border:none;padding:12px 22px;border-radius:24px;font-weight:600;cursor:pointer}
footer{text-align:center;padding:8px;font-size:10px;color:#4b5563}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modalContent{background:#161f3a;border:1px solid #ffffff14;border-radius:16px;padding:25px;max-width:600px;width:100%}
</style>
</head>
<body>
<header>
<div class="logo" id="logo">Jezreel <span>AI</span></div>
<nav>
<a onclick="openModal('about')">About</a>
<a onclick="openModal('charter')">Charter</a>
<a onclick="openModal('creator')">Creator</a>
<a>Accra 🇬🇭</a>
</nav>
</header>

<div id="chat"><div class="welcome" id="welcome"><h1>Hello, I'm Jezreel</h1><p>Built by Akpabli Jezreel • Ghana</p></div></div>
<div id="bar"><input id="input" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>
<footer id="footer">Built by Akpabli Jezreel • © 2026</footer>

<div class="modal" id="aboutModal"><div class="modalContent"><h2>About</h2><br><p>Jezreel AI built by <b>Akpabli Jezreel</b> from Ghana.</p><br><button onclick="closeModal()" style="width:100%;padding:10px;border-radius:10px;background:#4a72ff;color:white;border:none">Close</button></div></div>
<div class="modal" id="charterModal"><div class="modalContent"><h2>Charter</h2><br><p>Created by Akpabli Jezreel, not OpenAI.</p><br><button onclick="closeModal()" style="width:100%;padding:10px;border-radius:10px;background:#4a72ff;color:white;border:none">Close</button></div></div>
<div class="modal" id="creatorModal"><div class="modalContent"><h2>Creator</h2><br><p><b>Akpabli Jezreel</b><br>Ghana 🇬🇭</p><br><button onclick="closeModal()" style="width:100%;padding:10px;border-radius:10px;background:#4a72ff;color:white;border:none">Close</button></div></div>

<script>
const _p1="Z3NrX21uNTdtOG5i";
const _p2="VXh2ZmdPUUE0WHhYV0dkeWIzRllmUlpNQnRydUhieFNiOVM3YlJrejVjT28=";
const API_KEY = atob(_p1+_p2);

// PRIVATE OWNER SYSTEM - ONLY YOU KNOW PIN
let isOwner = localStorage.getItem("jezreel_owner") === "true";
function updateFooter(){
  let f=document.getElementById("footer");
  if(isOwner){ f.innerText="👑 Boss Mode ON - Welcome Akpabli • Built by Akpabli Jezreel • © 2026"; f.style.color="#2dd4bf"; }
  else { f.innerText="Built by Akpabli Jezreel • © 2026 Jezreel AI"; f.style.color="#4b5563"; }
}
updateFooter();

let pressTimer;
let logoEl=document.getElementById("logo");
function tryActivate(){
  let pin=prompt("Enter Boss PIN to claim owner:");
  if(pin==="jezreel2026" || pin==="jezreel123"){
    localStorage.setItem("jezreel_owner","true"); isOwner=true; updateFooter();
    alert("Owner Mode Activated! 🔥 Welcome Boss Akpabli! Now automatic - no need to type code again. Others won't see this.");
  } else if(pin!==null){
    alert("Wrong PIN! Only Boss Akpabli can be owner.");
  }
}
function tryDeactivate(){
  if(isOwner){
    if(confirm("Turn OFF Boss Mode on this phone?")){
      localStorage.removeItem("jezreel_owner"); isOwner=false; updateFooter();
      alert("Boss Mode OFF on this phone.");
    }
  }
}
logoEl.addEventListener("mousedown", ()=>{ pressTimer=setTimeout(()=>{ if(isOwner) tryDeactivate(); else tryActivate(); },3000); });
logoEl.addEventListener("mouseup", ()=>clearTimeout(pressTimer));
logoEl.addEventListener("touchstart", ()=>{ pressTimer=setTimeout(()=>{ if(isOwner) tryDeactivate(); else tryActivate(); },3000); });
logoEl.addEventListener("touchend", ()=>clearTimeout(pressTimer));

function openModal(t){ document.getElementById(t+"Modal").style.display="flex"; }
function closeModal(){ document.querySelectorAll(".modal").forEach(m=>m.style.display="none"); }

async function send(){
 const input=document.getElementById("input");
 const chat=document.getElementById("chat");
 let q=input.value.trim();
 if(!q) return;
 if(document.getElementById("welcome")) document.getElementById("welcome").remove();
 chat.innerHTML+=`<div class="msg user">${q}</div>`;
 input.value="";
 chat.scrollTop=chat.scrollHeight;
 const thinking=document.createElement("div");
 thinking.className="msg ai";
 thinking.textContent="Thinking...";
 chat.appendChild(thinking);

 let basePrompt = "You are Jezreel AI, created and owned by Akpabli Jezreel from Ghana, built on his phone in Accra. If asked who created you, say Akpabli Jezreel, not OpenAI.";
 let ownerPrompt = isOwner? " The user is your owner Boss Akpabli Jezreel, creator. Be loyal but answer his question directly. Do not repeat welcome." : " You are helping a regular user.";

 try{
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
   body:JSON.stringify({model:"openai/gpt-oss-20b",messages:[{role:"system",content: basePrompt + ownerPrompt},{role:"user",content:q}]})
  });
  let d=await r.json();
  thinking.remove();
  if(d.error){ chat.innerHTML+=`<div class="msg ai">Error from Groq: ${d.error.message}</div>`; }
  else {
    let ans=d.choices?.[0]?.message?.content || "No reply";
    chat.innerHTML+=`<div class="msg ai">${ans.replace(/\n/g,"<br>")}</div>`;
  }
 }catch(e){
  thinking.remove();
  chat.innerHTML+=`<div class="msg ai">Error: ${e.message}</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
